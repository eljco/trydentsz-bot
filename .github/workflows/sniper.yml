name: CS2 Cloud Sniper

on:
  schedule:
    - cron: '*/30 * * * *'   # safety net: restarts the chain if it ever breaks (concurrency prevents overlap)
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: 'Send a test Discord alert'
        type: boolean
        default: false

concurrency:
  group: cs2-sniper
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests brotli

      - name: Restore seen listings
        uses: actions/cache@v4
        with:
          path: seen_ids.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Run Sniper Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          SEND_TEST_ALERT: ${{ github.event.inputs.send_test_alert || 'false' }}
          RUN_SECONDS: '900'
        run: python sniper.py

      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run "CS2 Cloud Sniper" --ref "${{ github.ref_name }}"
