name: CS2 Cloud Sniper

on:
  schedule:
    - cron: '*/20 * * * *'   # safety net: restarts the chain if it ever breaks
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: 'Send a test Discord alert'
        type: boolean
        default: false

concurrency:
  group: cs2-sniper
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Queue the NEXT run right now. It waits in the concurrency group and starts the second this job
      # ends, so there is no gap between runs (and no overlap).
      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run "CS2 Cloud Sniper" --ref "${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: sniper.py

      - name: Install Dependencies
        run: pip install requests brotli

      - name: Restore seen listings
        uses: actions/cache/restore@v4
        with:
          path: seen_ids.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Run Sniper Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_CHEAP: ${{ secrets.DISCORD_WEBHOOK_CHEAP }}
          DISCORD_WEBHOOK_KNIVES: ${{ secrets.DISCORD_WEBHOOK_KNIVES }}
          DISCORD_WEBHOOK_GLOVES: ${{ secrets.DISCORD_WEBHOOK_GLOVES }}
          DISCORD_WEBHOOK_OUNCETRA: ${{ secrets.DISCORD_WEBHOOK_OUNCETRA }}
          DISCORD_WEBHOOK_STATUS: ${{ secrets.DISCORD_WEBHOOK_STATUS }}
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          SEND_TEST_ALERT: ${{ github.event.inputs.send_test_alert || 'false' }}
          RUN_SECONDS: '1500'
        run: python sniper.py

      # always() so seen-ids are saved even if the run failed (prevents duplicate alerts next run)
      - name: Save seen listings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_ids.json
          key: seen-${{ github.run_id }}
