name: CS2 Cloud Sniper

on:
  schedule:
    - cron: '*/20 * * * *'   # safety net: restarts the chain if it ever breaks
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: 'Send a test Discord alert'
        type: boolean
        default: false

concurrency:
  group: cs2-sniper
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run "CS2 Cloud Sniper" --ref "${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: sniper.py

      - name: Install Dependencies
        run: pip install requests brotli

      - name: Restore seen listings & buyer state
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_ids.json
            buyer_state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run Sniper Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_CHEAP: ${{ secrets.DISCORD_WEBHOOK_CHEAP }}
          DISCORD_WEBHOOK_KNIVES: ${{ secrets.DISCORD_WEBHOOK_KNIVES }}
          DISCORD_WEBHOOK_GLOVES: ${{ secrets.DISCORD_WEBHOOK_GLOVES }}
          DISCORD_WEBHOOK_OUNCETRA: ${{ secrets.DISCORD_WEBHOOK_OUNCETRA }}
          DISCORD_WEBHOOK_BUYORDERS: ${{ secrets.DISCORD_WEBHOOK_BUYORDERS }}
          DISCORD_WEBHOOK_STATUS: ${{ secrets.DISCORD_WEBHOOK_STATUS }}
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          BUYER_MODE: ${{ secrets.BUYER_MODE }}
          DISCORD_WEBHOOK_TRADES: ${{ secrets.DISCORD_WEBHOOK_TRADES }}
          DAILY_BUDGET_EUR: '8'          # was 5
          CAPITAL_EUR: '116'             # rolling bankroll, money tied up for ~14 days per item
          BUDGET_TZ: 'Europe/Vilnius'    # daily budget resets at your midnight
          BUY_MAX_ITEM_USD: '4.00'       # was 3.00 so the 8 EUR budget has more deals to choose from
          AUTOLIST_MODE: 'live'        # notify = only posts what it WOULD list; change to live after checking the first one
          TRADE_LOCK_DAYS: '7'
          CREDIT_DAYS: '7'               # credit banner appears with <24h left, so ~7 days after the sale
          SEND_TEST_ALERT: ${{ github.event.inputs.send_test_alert || 'false' }}
          RUN_SECONDS: '1500'
        run: python sniper.py

      - name: Save seen listings & buyer state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_ids.json
            buyer_state.json
          key: state-${{ github.run_id }}
